name = "internship-render"
main = "render-worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Free Browser Rendering binding (10K requests/day on Workers Free)
[browser]
binding = "BROWSER"

# After deploy, set the shared token via:
#   wrangler secret put SHARED_TOKEN
# (Worker will read it as env.SHARED_TOKEN and require Authorization: Bearer <token>)
