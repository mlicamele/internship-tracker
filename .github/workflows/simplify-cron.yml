name: simplify-cron

# Daily poke to the Vercel-hosted /api/cron/simplify endpoint.
# We use GH Actions (not Vercel Cron) because Vercel Hobby limits crons
# to daily-only and adds observability friction — GH Actions gives us a
# manual re-run button + a clear log per run for free.
#
# Secrets required (Repo → Settings → Secrets → Actions):
#   SIMPLIFY_CRON_URL     e.g. https://internship-tracker.vercel.app/api/cron/simplify
#   SIMPLIFY_CRON_SECRET  matches the env var of the same name on Vercel

on:
  schedule:
    # 10:00 UTC = 06:00 ET (EDT summer / 05:00 EST winter). Runs once a day.
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: simplify-cron
  cancel-in-progress: false

jobs:
  poke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: POST to /api/cron/simplify
        env:
          URL: ${{ secrets.SIMPLIFY_CRON_URL }}
          SECRET: ${{ secrets.SIMPLIFY_CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "::error::SIMPLIFY_CRON_URL or SIMPLIFY_CRON_SECRET not configured"
            exit 1
          fi
          echo "POST $URL"
          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            --max-time 90 \
            -X POST \
            -H "X-Cron-Secret: $SECRET" \
            -H "Content-Type: application/json" \
            "$URL")
          echo "$response"
          status=$(echo "$response" | grep -oE 'HTTP_STATUS:[0-9]+' | cut -d: -f2)
          if [ "$status" != "200" ]; then
            echo "::error::cron endpoint returned HTTP $status"
            exit 1
          fi
